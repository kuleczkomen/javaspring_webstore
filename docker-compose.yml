services:
  db:
    image: postgres:16
    container_name: webstore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: webstore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webstore"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: webstore-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./.env:/app/.env:ro
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/webstore
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234

volumes:
  pgdata: